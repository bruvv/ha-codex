name: Codex Habitat image validation

on:
  pull_request:
    paths:
      - "codex_habitat/**"
      - ".github/workflows/validate-addon.yml"
      - ".github/scripts/**"
  # The Codex auto-update workflow dispatches this on its update branch before
  # releasing, since pushes made with GITHUB_TOKEN start no workflows. As its
  # own run, its checks carry the names main's ruleset requires.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    name: Build and smoke-test ${{ matrix.arch }} add-on
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read pinned build configuration
        id: build_config
        run: |
          app_dir="codex_habitat"
          # Home Assistant retired build.yaml; Supervisor warns when it finds one.
          if [ -e "$app_dir/build.yaml" ]; then
            echo "::error::$app_dir/build.yaml is deprecated. Keep build settings in the Dockerfile."
            exit 1
          fi
          # Every pin is an ARG default in the Dockerfile.
          for arg in BUILD_FROM TTYD_VERSION TRZSZ_VERSION CODEX_VERSION; do
            grep -Eq "^ARG ${arg}=\"?[^\"]+\"?$" "$app_dir/Dockerfile"
          done
          codex_version="$(sed -n 's/^ARG CODEX_VERSION="\(.*\)"$/\1/p' "$app_dir/Dockerfile")"
          test -n "$codex_version"
          echo "codex_version=$codex_version" >> "$GITHUB_OUTPUT"

      - name: Test reload confirmation instructions
        run: bash .github/scripts/test-reload-confirmation.sh

      # Build as Supervisor does: BuildKit for the target platform, passing only
      # BUILD_ARCH and BUILD_VERSION, so the Dockerfile's own defaults are tested.
      - name: Build pinned ${{ matrix.arch }} add-on image
        run: |
          addon_version="$(sed -n 's/^version: "\(.*\)"$/\1/p' codex_habitat/config.yaml)"
          test -n "$addon_version"
          docker buildx build \
            --load \
            --pull \
            --platform ${{ matrix.platform }} \
            --build-arg BUILD_ARCH=${{ matrix.arch }} \
            --build-arg BUILD_VERSION="$addon_version" \
            --tag codex-habitat:pr-${{ github.event.pull_request.number || github.run_id }}-${{ matrix.arch }} \
            codex_habitat

      - name: Test terminal settings and release scripts
        run: |
          run_id="${{ github.event.pull_request.number || github.run_id }}"
          image="codex-habitat:pr-${run_id}-${{ matrix.arch }}"
          docker run --rm --network none \
            --volume "$PWD:/repo:ro" --workdir /repo \
            --entrypoint bash "$image" -ec '
              node .github/scripts/test-ha-helper.mjs
              bash .github/scripts/test-terminal-settings.sh
              bash .github/scripts/test-update-codex.sh
              bash .github/scripts/test-publish-release.sh
            '

      - name: Verify runtime dependencies
        env:
          EXPECTED_CODEX_VERSION: ${{ steps.build_config.outputs.codex_version }}
        run: |
          image="codex-habitat:pr-${{ github.event.pull_request.number || github.run_id }}-${{ matrix.arch }}"
          docker run --rm --env EXPECTED_CODEX_VERSION --entrypoint /bin/sh "$image" -ec '
            command -v codex
            test -x /usr/local/bin/codex
            test "$(codex --version)" = "codex-cli ${EXPECTED_CODEX_VERSION}"
            command -v codex-code-mode-host
            test -x /usr/local/bin/codex-code-mode-host
            codex-code-mode-host --help
            command -v node
            node --version
            codex-habitat-ha --help
            for helper in codex-habitat-bluetooth codex-habitat-registry \
                presence-policy-payload bedroom-policy-payload; do
              node --check "/usr/local/bin/${helper}.mjs"
            done
            if command -v npm >/dev/null 2>&1; then
              echo "npm must not be installed" >&2
              exit 1
            fi
          '

      - name: Verify image metadata
        run: |
          image="codex-habitat:pr-${{ github.event.pull_request.number || github.run_id }}-${{ matrix.arch }}"
          test "$(docker image inspect "$image" --format '{{.Config.WorkingDir}}')" = "/homeassistant"
          test "$(docker image inspect "$image" --format '{{json .Config.Cmd}}')" = '["/run.sh"]'
          docker image inspect "$image" --format '{{json .Config.Healthcheck.Test}}' |
            grep -F 'http://127.0.0.1:7681/'

      - name: Verify configured models and healthy add-on startup
        run: |
          run_id="${{ github.event.pull_request.number || github.run_id }}"
          image="codex-habitat:pr-${run_id}-${{ matrix.arch }}"
          options_file="$RUNNER_TEMP/codex-habitat-options.json"
          printf '{}\n' > "$options_file"

          # Bashio reads options from Supervisor, not /data/options.json.
          # Supply only that read endpoint on an isolated CI network.
          docker network create --internal codex-habitat-smoke
          docker run --detach \
            --name codex-habitat-supervisor-fixture \
            --network codex-habitat-smoke --network-alias supervisor \
            --volume "$options_file:/data/options.json:ro" \
            --volume "$PWD/.github/scripts/supervisor-options-fixture.cjs:/fixture.cjs:ro" \
            --entrypoint node "$image" /fixture.cjs

          for attempt in $(seq 1 20); do
            if docker exec codex-habitat-supervisor-fixture curl --fail --silent http://127.0.0.1/addons/self/options/config; then
              break
            fi
            sleep 1
          done
          docker exec codex-habitat-supervisor-fixture curl --fail --silent http://127.0.0.1/addons/self/options/config

          default_model="$(awk '$1 == "model:" && $2 !~ /^list\(/ {print $2}' codex_habitat/config.yaml)"
          test -n "$default_model"
          # Each case is model:selected effort:effort the add-on should use.
          # "default" has no model saved in Codex here, so nothing is lowered.
          # The last one checks that a level the model lacks is lowered.
          for case in $(printf '%s\n' "$default_model:xhigh:xhigh" default:ultra:ultra gpt-6-astra:ultra:ultra gpt-6.1-sol:ultra:ultra gpt-6-sol:xhigh:xhigh gpt-6.1-terra:ultra:ultra gpt-6-luna:max:max gpt-6-luna:ultra:max | awk '!seen[$0]++'); do
            IFS=: read -r model effort expected_effort <<< "$case"
            grep -E '^  model: list\(' codex_habitat/config.yaml | grep -F "$model"
            grep -E '^  reasoning_effort: list\(' codex_habitat/config.yaml | grep -E "[(|]${effort}[|)]"
            printf '{"model":"%s","reasoning_effort":"%s","terminal_font_size":14,"terminal_scrollback":5000,"terminal_theme":"dark","session_persistence":true,"preserve_terminal_history":true,"patch_compatibility_mode":true,"skip_command_approvals":false,"file_transfer":false,"memories":false,"home_assistant_control":false,"allow_home_assistant_restart":false}\n' "$model" "$effort" > "$options_file"
            docker run --detach --name codex-habitat-runtime-smoke \
              --network codex-habitat-smoke "$image"

            for attempt in $(seq 1 24); do
              status="$(docker inspect codex-habitat-runtime-smoke --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}')"
              if [ "$status" = "healthy" ]; then
                break
              fi
              if [ "$status" = "unhealthy" ] || [ "$(docker inspect codex-habitat-runtime-smoke --format '{{.State.Running}}')" != "true" ]; then
                docker logs codex-habitat-runtime-smoke
                exit 1
              fi
              sleep 5
            done

            test "$(docker inspect codex-habitat-runtime-smoke --format '{{.State.Health.Status}}')" = "healthy"
            logs="$(docker logs codex-habitat-runtime-smoke 2>&1)"
            printf '%s\n' "$logs"
            printf '%s\n' "$logs" | grep -F "Using Codex model: ${model}."
            if [ "$model" = "default" ]; then
              printf '%s\n' "$logs" | grep -F 'No model is saved in Codex yet, so Codex will use its own default.'
            fi
            printf '%s\n' "$logs" | grep -F "Reasoning effort: ${expected_effort}."
            if [ "$effort" != "$expected_effort" ]; then
              printf '%s\n' "$logs" | grep -F "Reasoning effort ${effort} is not available for ${model}; using ${expected_effort}"
            elif printf '%s\n' "$logs" | grep -F 'is not available for'; then
              exit 1
            fi
            printf '%s\n' "$logs" | grep -F 'Terminal history mode: inline.'
            printf '%s\n' "$logs" | grep -F 'Home Assistant control actions: false; Core restart: false.'
            printf '%s\n' "$logs" | grep -F 'Codex memories: false'
            printf '%s\n' "$logs" | grep -F 'Skip command approvals: false'
            if printf '%s\n' "$logs" | grep -E 'ERROR:|Failed to get addon config'; then
              exit 1
            fi
            docker rm --force codex-habitat-runtime-smoke
          done

      - name: Clean up runtime containers and network
        if: always()
        run: |
          docker rm --force codex-habitat-runtime-smoke codex-habitat-supervisor-fixture 2>/dev/null || true
          docker network rm codex-habitat-smoke 2>/dev/null || true
